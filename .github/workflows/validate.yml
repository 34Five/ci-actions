name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository defines the gates; a broken action.yml here breaks CI in every
  # repository that consumes it, and the failure surfaces there rather than here.
  # So the shape is checked at the source.
  actions:
    name: Check (action definitions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Every action.yml parses and declares a composite runner
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in actions/*/action.yml; do
            found=$((found + 1))
            python3 - "$f" <<'PY'
          import sys, pathlib
          f = pathlib.Path(sys.argv[1])
          text = f.read_text()
          # No PyYAML on the runner image, and adding a dependency to check a
          # dependency-free repository is its own cost. These are the assertions that
          # actually matter and they are all structural.
          for required in ("name:", "description:", "runs:", "using: composite", "steps:"):
              if required not in text:
                  sys.exit(f"::error file={f}::missing `{required}`")
          if "shell: bash" not in text:
              sys.exit(f"::error file={f}::a composite `run:` step needs `shell:`")
          print(f"ok {f}")
          PY
          done
          # A loop over a glob that matches nothing succeeds and proves nothing —
          # the same failure this organization's CI guards against elsewhere.
          if [ "$found" -eq 0 ]; then
            echo "::error::no actions/*/action.yml found — this job proved nothing"
            exit 1
          fi
          echo "checked $found action definition(s)"

  # Dogfooding: this repository is scanned by the action it publishes. If the action
  # breaks, this job is the first thing to say so.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A LOCAL `./` ACTION NEEDS THE REPOSITORY ON DISK FIRST — the runner resolves the
      # path before any step runs, so without this the job dies with "Did you forget to
      # run actions/checkout before running your local action?". Consumers do NOT need
      # this: they reference `34Five/.github/actions/secret-scan@v1`, which the runner
      # fetches by itself. The action then checks out again at fetch-depth 0, which is
      # the depth the scan actually requires and the reason this one is left shallow.
      - uses: actions/checkout@v7.0.1
      - uses: ./actions/secret-scan

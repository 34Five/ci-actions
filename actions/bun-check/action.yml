name: Bun check
description: >-
  Install, typecheck and test a Bun workspace. Shared by the Cloudflare Workers
  repositories (AuraLayer, AuraComms) so the toolchain pin and the test policy
  live in one place rather than drifting per repository.

inputs:
  bun-version:
    description: >-
      Pinned Bun release. `latest` made builds non-reproducible across runs in
      AuraLayer, which is the reason this is pinned rather than floating. Changing
      it here changes it for every repository at once — which is the point, and
      also the reason to change it deliberately.
    required: false
    default: "1.3.11"
  test-passes:
    description: >-
      How many times to run the suite. The Workers suites share one D1/DO storage
      across files and run single-worker, so an order-dependent leak between files
      surfaces as an intermittent failure that one pass will not reliably show.
      A repository whose suite does not share storage can set this to 1.
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # --frozen-lockfile: fail on a stale lockfile rather than silently resolving
    # something the committed tree never described.
    - name: Install
      shell: bash
      run: bun install --frozen-lockfile

    - name: Typecheck
      shell: bash
      run: bun run typecheck

    # Via env rather than interpolated into the script — see the note in
    # secret-scan/action.yml. `seq` also fails loudly on a non-numeric value here,
    # where an interpolation would have produced a silently malformed loop.
    - name: Test
      shell: bash
      env:
        TEST_PASSES: ${{ inputs.test-passes }}
      run: |
        set -euo pipefail
        for i in $(seq 1 "$TEST_PASSES"); do
          echo "::group::test run $i of $TEST_PASSES"
          bun run test || exit 1
          echo "::endgroup::"
        done
